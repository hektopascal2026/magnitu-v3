name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync contract tests
        run: python test_sync.py

      - name: Integration tests
        run: python test_magnitu2.py

      - name: Multi-user sync tests
        run: python test_multiuser.py

      - name: ML window, prior-correction, and common-eval tests
        run: |
          pip install pytest
          python -m pytest test_ml_window.py test_prior_correction.py test_common_eval.py test_recipe_quality.py test_recipe_parity.py test_recipe_memory.py test_distill_sample.py test_score_repair.py test_score_repair_scan.py test_score_push_worker.py test_score_push_checkpoint.py test_score_delivery.py test_score_text_scan.py -q
